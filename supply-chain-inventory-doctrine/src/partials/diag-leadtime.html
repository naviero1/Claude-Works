<figure class="diag">
  <svg class="dg" viewBox="0 0 720 262" role="img" aria-label="Before 2019 the safety stock formula treated replenishment lead time as a fixed 30 days, so the only uncertainty buffered came from demand. After 2020 lead time itself became a wide, right-skewed distribution, and the lead-time variance term that had been assumed away became the dominant one.">
    <defs>
      <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="currentColor"/>
      </marker>
      <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="var(--era-2)"/>
      </marker>
    </defs>

    <text class="e f1" x="0" y="12">Before 2019</text>
    <text class="t f1" x="86" y="13">Lead time is a number</text>
    <line class="hair" x1="0" y1="26" x2="720" y2="26"/>

    <text x="0" y="60">order</text>
    <text x="0" y="74">placed</text>
    <line class="ln" x1="46" y1="64" x2="82" y2="64" marker-end="url(#ar)"/>
    <rect class="box" x="88" y="52" width="330" height="24" rx="2"/>
    <text x="253" y="68" text-anchor="middle">L = 30 days · a constant</text>
    <line class="ln" x1="422" y1="64" x2="458" y2="64" marker-end="url(#ar)"/>
    <text x="464" y="60">goods</text>
    <text x="464" y="74">received</text>

    <path class="ln k1 nf" d="M566 78 C 580 78 582 44 596 44 C 610 44 612 78 626 78"/>
    <line class="hair" x1="556" y1="78" x2="636" y2="78"/>
    <text class="f1" x="596" y="94" text-anchor="middle">σ_D — the only</text>
    <text class="f1" x="596" y="106" text-anchor="middle">modelled variance</text>

    <line class="hair" x1="0" y1="126" x2="720" y2="126"/>
    <text class="e f2" x="0" y="150">After 2020</text>
    <text class="t f2" x="86" y="151">Lead time is a distribution</text>
    <line class="hair" x1="0" y1="164" x2="720" y2="164"/>

    <text x="0" y="200">order</text>
    <text x="0" y="214">placed</text>
    <line class="ln" x1="46" y1="204" x2="82" y2="204" marker-end="url(#ar)"/>
    <path d="M88 192 L418 192 L664 178 L664 232 L418 216 L88 216 Z" class="f2" opacity=".12"/>
    <rect class="box" x="88" y="192" width="330" height="24" rx="2"/>
    <text x="253" y="208" text-anchor="middle">L = 30 days</text>
    <line class="ln k2" x1="422" y1="198" x2="492" y2="198" marker-end="url(#ar2)" opacity=".9"/>
    <line class="ln k2" x1="422" y1="210" x2="566" y2="210" marker-end="url(#ar2)" opacity=".62"/>
    <line class="ln k2" x1="422" y1="222" x2="662" y2="222" marker-end="url(#ar2)" opacity=".4"/>
    <text class="f2" x="430" y="184">…or 45. or 71. or it never sailed.</text>
    <text class="big f2" x="440" y="248">σ_L ≫ 0</text>
  </svg>
  <figcaption>The classical buffer sized <b>one</b> uncertainty. Holding lead time constant makes the term
    <span class="num">D̄²·σ_L²</span> vanish, so the whole safety stock reduces to <span class="num">z·σ_D·√L</span> —
    the formula that shipped inside essentially every ERP system. It is not wrong; it is <em>conditional</em>. When
    σ_L went from near-zero to weeks, the term that had been assumed away became the larger of the two.</figcaption>
</figure>
