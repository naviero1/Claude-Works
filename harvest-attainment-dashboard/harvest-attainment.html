<title>Tissue Harvest Attainment</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&display=swap">
<style>
:root{
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --good:#0ca30c; --warn:#fab219; --serious:#ec835a; --crit:#d03b3b;
  --goodtext:#006300;
  --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70;
    --goodtext:#0ca30c; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --goodtext:#0ca30c; --accent:#3987e5;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:var(--page); color:var(--ink); margin:0;
  font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;
}
.wrap{max-width:1180px; margin:0 auto; padding-block:0 48px; padding-inline:16px}
h1,h2,h3{font-family:"Archivo",system-ui,sans-serif; text-wrap:balance; margin:0}
a{color:var(--accent)}

/* header */
.top{display:flex; flex-wrap:wrap; gap:12px 20px; align-items:flex-end; justify-content:space-between; padding-block:22px 14px}
.top h1{font-size:24px; font-weight:700; letter-spacing:-.01em}
.top .sub{color:var(--ink2); margin-top:3px; font-size:13px}
.filechip{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.filechip .name{background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:7px 12px; font-size:12.5px; color:var(--ink2)}
.filechip .name strong{color:var(--ink); font-weight:600}
button, select{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--border);
  border-radius:8px; padding:7px 12px; cursor:pointer;
}
button:hover{border-color:var(--axis)}
button:focus-visible, select:focus-visible, .tab:focus-visible, summary:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.primary{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}

/* filter bar */
.filters{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:center; padding:12px 14px; background:var(--surface); border:1px solid var(--border); border-radius:12px}
.filters .lbl{font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); font-weight:600}
.chip{border-radius:999px; padding:5px 12px; font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--accent); color:#fff; border-color:transparent; font-weight:600}
.filters .count{margin-left:auto; color:var(--muted); font-size:12.5px}
.filters .sep{width:1px; align-self:stretch; background:var(--grid); margin-inline:2px}

/* tabs */
.tabs{display:flex; flex-wrap:wrap; gap:6px; margin-block:16px 18px}
.tab{background:none; border:1px solid transparent; color:var(--ink2); padding:7px 13px; border-radius:8px; font-weight:500}
.tab[aria-selected="true"]{background:var(--surface); border-color:var(--border); color:var(--ink); font-weight:600}

/* layout blocks */
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px; margin-bottom:14px}
.cards.tiles{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px 18px; min-width:0}
.card.span{grid-column:1 / -1}
.card h3{font-size:14.5px; font-weight:600; margin-bottom:2px}
.card .note{color:var(--muted); font-size:12px; margin:2px 0 10px}
.sectionhead{margin:22px 0 10px}
.sectionhead h2{font-size:17px}
.sectionhead p{color:var(--ink2); font-size:13px; margin:4px 0 0; max-width:68ch}

/* stat tiles */
.tile .lb{font-size:12px; color:var(--ink2)}
.tile .val{font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-weight:600; font-size:27px; margin-top:2px; letter-spacing:-.01em}
.tile .val small{font-size:14px; font-weight:500; color:var(--ink2)}
.tile .delta{font-size:12px; margin-top:3px; color:var(--ink2)}
.tile .delta .up{color:var(--goodtext); font-weight:600}
.tile .delta .down{color:var(--crit); font-weight:600}
.hero .val{font-size:48px}
.spark{margin-top:8px}

/* status pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:600; border-radius:999px; padding:2px 9px; white-space:nowrap}
.pill.good{color:var(--goodtext); background:color-mix(in srgb, var(--good) 14%, transparent)}
.pill.warn{color:var(--ink); background:color-mix(in srgb, var(--warn) 22%, transparent)}
.pill.serious{color:var(--ink); background:color-mix(in srgb, var(--serious) 22%, transparent)}
.pill.crit{color:#fff; background:var(--crit)}

/* meters */
.meter{height:10px; border-radius:5px; position:relative; overflow:hidden; margin-top:8px}
.meter .fill{position:absolute; inset:0 auto 0 0; border-radius:5px 4px 4px 5px}
.meterrow{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.meterrow .big{font-size:22px; font-weight:600}

/* h-bars */
.hbars{display:grid; grid-template-columns:minmax(120px,200px) 1fr; gap:6px 10px; align-items:center}
.hbars .blb{font-size:12.5px; text-align:right; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.hbars .blb small{color:var(--muted); display:block; font-size:11px; line-height:1.2}
.htrack{position:relative; height:18px}
.hfill{position:absolute; top:1px; bottom:1px; left:0; background:var(--s1); border-radius:0 4px 4px 0; min-width:2px}
.hseg{position:absolute; top:1px; bottom:1px}
.hseg.last{border-radius:0 4px 4px 0}
.htarget{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--axis)}
.hval{position:absolute; top:50%; transform:translateY(-50%); font-size:11.5px; color:var(--ink2); white-space:nowrap; padding-left:6px}
.hval.in{color:#fff; transform:translate(-100%,-50%); padding:0 6px 0 0}

/* legend */
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; margin:2px 0 8px; font-size:12px; color:var(--ink2)}
.legend .k{display:inline-flex; align-items:center; gap:6px}
.legend .line{width:16px; height:0; border-top:3px solid; border-radius:2px}
.legend .box{width:11px; height:11px; border-radius:3px}

/* heatmap */
.heat{display:grid; gap:2px; font-size:12px}
.heat .hd{font-size:11px; font-weight:600; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:4px 6px; align-self:end}
.heat .rowlb{font-size:12.5px; padding:0 8px 0 0; display:flex; align-items:center; justify-content:flex-end; text-align:right; color:var(--ink)}
.heat .cell{border-radius:4px; padding:6px 4px; text-align:center; font-variant-numeric:tabular-nums; cursor:default; min-width:0}
.heat .cell.none{background:color-mix(in srgb, var(--grid) 45%, transparent); color:var(--muted)}
.heatwrap{overflow-x:auto}
.ramplegend{display:flex; align-items:center; gap:8px; margin-top:10px; font-size:11px; color:var(--muted)}
.ramplegend .bar{height:8px; flex:0 1 180px; border-radius:4px}

/* tables */
details.twin{margin-top:12px; border-top:1px solid var(--grid); padding-top:8px}
details.twin summary{cursor:pointer; color:var(--ink2); font-size:12.5px; font-weight:600}
.tblwrap{overflow-x:auto; margin-top:8px}
table{border-collapse:collapse; font-size:12.5px; min-width:420px}
th{font-size:11px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:right; font-weight:600; padding:5px 10px; border-bottom:1px solid var(--grid)}
th:first-child, td:first-child{text-align:left; padding-left:0}
td{padding:5px 10px; border-bottom:1px solid var(--grid); text-align:right; font-variant-numeric:tabular-nums; color:var(--ink)}
td.dim{color:var(--muted)}
tr.total td{font-weight:600; border-top:1px solid var(--axis)}

/* svg charts */
.chart svg{display:block; width:100%; height:auto}
.chart text{font:11px system-ui,-apple-system,"Segoe UI",sans-serif; fill:var(--muted)}
.chart .axistext{font-variant-numeric:tabular-nums}
.chart .dlab{fill:var(--ink2); font-weight:600}

/* tooltip */
#tip{position:fixed; z-index:50; pointer-events:none; background:var(--surface); color:var(--ink);
  border:1px solid var(--border); border-radius:9px; padding:8px 11px; font-size:12px;
  box-shadow:0 4px 18px rgba(0,0,0,.18); max-width:260px}
#tip .t{font-weight:600; margin-bottom:3px}
#tip .r{display:flex; align-items:center; gap:7px; margin-top:2px}
#tip .r .key{width:12px; border-top:3px solid; border-radius:2px; flex:none}
#tip .r .v{font-weight:600; font-variant-numeric:tabular-nums}
#tip .r .n{color:var(--ink2)}

/* drop overlay + toast */
#drop{position:fixed; inset:0; z-index:60; background:color-mix(in srgb, var(--page) 82%, transparent);
  display:flex; align-items:center; justify-content:center; border:3px dashed var(--accent); font-size:20px; font-weight:600; color:var(--accent)}
#toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px)); z-index:70;
  background:var(--ink); color:var(--page); border-radius:10px; padding:10px 16px; font-size:13px; max-width:90vw}
.banner{background:color-mix(in srgb, var(--warn) 12%, var(--surface)); border:1px solid var(--border); border-radius:10px; padding:10px 14px; font-size:12.5px; color:var(--ink2); margin-bottom:14px}
.banner strong{color:var(--ink)}
.smallmults{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px}
@media (max-width:520px){ .top h1{font-size:20px} .hero .val{font-size:38px} }
</style>

<div class="wrap">
  <header class="top">

  </nav>

  <main id="main"></main>
</div>

<div id="tip" hidden></div>
<div id="drop" hidden>Drop a weekly-goals or capacity workbook</div>
<div id="toast" hidden></div>

  return s ? '<span class="pill '+s.cls+'"><span aria-hidden="true">'+s.icon+'</span>'+s.label+'</span>' : '';
}
function rampColor(ramp, t){
  if (t==null || !isFinite(t)) return null;
  t = Math.max(0, Math.min(1, t));
  return ramp[Math.min(ramp.length-1, Math.floor(t*ramp.length))];
}
function inkFor(hex){
  const n = parseInt(hex.slice(1),16), r=n>>16&255, g=n>>8&255, b=n&255;
  return (0.2126*r + 0.7152*g + 0.0722*b) > 145 ? '#0b0b0b' : '#ffffff';
}
function niceMax(v){
  if (v<=0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for (const m of [1,1.2,1.5,2,2.5,3,4,5,6,8,10]) if (m*p >= v) return m*p;
  return 10*p;
}

/* ---------- cycles ----------
   The weekly-goals workbook runs on 2-week goal cycles: a "week 1 of 2" tab
   carries the cycle's ask, and its "Week 2 of 2" tab carries the REMAINING
   ask (cycle ask minus week-1 harvest). Summing both would double-count the
   goal, so tabs are grouped into cycles: goal counted once (max ask per
   SH across the cycle's tabs), harvest summed. Tabs are grouped by their
   C1 marker; unmarked tabs fall back to an empirical remainder test. */
function parseMarker(c1){ const m=/week\s*(\d+)\s*of\s*(\d+)/i.exec(c1||''); return m ? {n:+m[1], of:+m[2]} : null }
function isRemainderOf(a, b){
  const rb = new Map(b.rows.map(t=>[t.pn,t]));
  let tot=0, hit=0;
  for (const t of a.rows){
    const t2 = rb.get(t.pn);
    for (let s=0;s<3;s++){
      const askB = t2 ? t2.ask[s] : 0;
      if (t.ask[s]===0 && askB===0) continue;
      tot++;
      if (t2 && Math.abs(askB - (t.ask[s]-t.ach[s])) <= 1) hit++;
    }
  }
  return tot>=5 && hit/tot>=0.9;
}
function buildPeriods(){
  // Tabs marked "week N of 2" group by their marker. Unmarked tabs fall back
  // to the empirical remainder test — validated against the workbook's own
  // quarter sheets, which count the unmarked 12/29+1/05 pair as one cycle.
  const ps=[]; let prev=null;
  for (const w of S.weeks){
    const mk = parseMarker(w.c1);
    const cont = ps.length>0 && (mk ? mk.n>=2 : (prev && isRemainderOf(prev,w)));
    if (cont) ps[ps.length-1].weeks.push(w); else ps.push({weeks:[w]});
    prev = w;
  }
  for (const p of ps){
    const w0 = p.weeks[0];
    p.name = w0.name; p.date = w0.date; p.label = weekLabel(w0); p.span = p.weeks.length;
    const rows = new Map();
    for (const w of p.weeks) for (const t of w.rows){
      let e = rows.get(t.pn);
      if (!e){ e = {pn:t.pn, goal:[0,0,0], ach:[0,0,0]}; rows.set(t.pn, e); }
      for (let s=0;s<3;s++){
        e.goal[s] = Math.max(e.goal[s], t.ask[s]);
        e.ach[s] += t.ach[s];
      }
    }
    p.rows = Array.from(rows.values());
    p.pigs = [0,0,0];
    for (const w of p.weeks) if (w.pigs) for (let s=0;s<3;s++) p.pigs[s] += w.pigs.sh[s];
  }
  return ps;
}
function loadData(d, sourceName){
  S.weeks = d.weeks.slice().sort((a,b)=> a.date < b.date ? -1 : 1);
  S.names = Object.assign({}, S.names, d.tissueNames || {});
  if (d.labor) S.labor = Object.assign({}, S.labor, d.labor);
  S.source = sourceName || d.source || 'workbook';
  S.periods = buildPeriods();
  S.from = 0; S.to = S.periods.length - 1;
  S.drillWeek = null;
}

/* ---------- slicing & aggregation (period = goal cycle) ---------- */
function slice(){ return S.periods.slice(S.from, S.to+1) }
function isReported(p){ return p.rows.some(t => sum(t.ach) > 0) }
function reported(){ return slice().filter(isReported) }
function weeksOf(ps){ return ps.flatMap(p=>p.weeks) }

function aggSH(ps){
  const a = SHS.map(()=>({goal:0, ach:0, pigs:0}));
  for (const p of ps) for (let s=0;s<3;s++){
    for (const t of p.rows){ a[s].goal += t.goal[s]; a[s].ach += t.ach[s]; }
    a[s].pigs += p.pigs[s];
  }
  return a;
}
function periodSH(ps){
  return ps.map(p => {
    const goal=[0,0,0], ach=[0,0,0];
    for (const t of p.rows) for (let s=0;s<3;s++){ goal[s]+=t.goal[s]; ach[s]+=t.ach[s]; }
    return {p, goal, ach, att: goal.map((g,i)=> g>0 ? ach[i]/g : null),
            totAtt: sum(goal)>0 ? sum(ach)/sum(goal) : null};
  });
}
function aggTissue(ps){
  const m = new Map();
  for (const p of ps) for (const t of p.rows){
    let e = m.get(t.pn); if(!e){ e={pn:t.pn, goal:0, ach:0, goalSH:[0,0,0], achSH:[0,0,0]}; m.set(t.pn,e); }
    for (let s=0;s<3;s++){ e.goalSH[s]+=t.goal[s]; e.achSH[s]+=t.ach[s]; e.goal+=t.goal[s]; e.ach+=t.ach[s]; }
  }
  return Array.from(m.values());
}
function shTissuePeriod(ps){
  // pn -> sh -> array of per-cycle attainment (cycles where goal>0)
  const m = new Map();
  for (const p of ps) for (const t of p.rows){
    let e = m.get(t.pn); if(!e){ e=[[],[],[]]; m.set(t.pn,e); }
    for (let s=0;s<3;s++) if (t.goal[s] > 0) e[s].push(t.ach[s]/t.goal[s]);
  }
  return m;
}
function techStats(ps){
  const T = new Map();
  const get = n => { let e=T.get(n); if(!e){ e={units:0, min:0, goal:0, days:0}; T.set(n,e);} return e; };
  for (const p of ps){
    const daysBySH = [{},{},{}];
    for (const w of p.weeks){
      for (let k=0;k<15;k++){
        const tech = w.techs[k], sh = k % 3;
        if (tech){
          daysBySH[sh][tech] = (daysBySH[sh][tech]||0) + 1;
          const e = get(tech); e.days++;
          for (const t of w.rows){ const v=t.daily[k]||0; e.units+=v; e.min+=v*laborMin(t.pn); }
        } else {
          let v=0, mn=0;
          for (const t of w.rows){ v += t.daily[k]||0; mn += (t.daily[k]||0)*laborMin(t.pn); }
          if (v>0){ const e=get('Unassigned'); e.units+=v; e.min+=mn; }
        }
      }
    }
    for (let s=0;s<3;s++){
      let goal=0; for (const t of p.rows) goal += t.goal[s];
      if (goal<=0) continue;
      const d = daysBySH[s], tot = sum(Object.values(d));
      if (tot>0) for (const [tech,n] of Object.entries(d)) get(tech).goal += goal*n/tot;
      else get('Unassigned').goal += goal;
    }
  }
  return T;
}
function laborBySH(ps){
  const a=[0,0,0];
  for (const w of weeksOf(ps)) for (const t of w.rows){
    const lm = laborMin(t.pn);
    for (let s=0;s<3;s++) a[s] += t.ach[s]*lm;
  }
  return a.map(m=>m/60);
}
function laborByTissue(ps){
  // per tissue: units harvested and labor minutes, split by site
  const m = new Map();
  for (const w of weeksOf(ps)) for (const t of w.rows){
    const lm = laborMin(t.pn);
    let e = m.get(t.pn); if(!e){ e={pn:t.pn, units:[0,0,0], min:[0,0,0]}; m.set(t.pn,e); }
    for (let s=0;s<3;s++){ e.units[s]+=t.ach[s]; e.min[s]+=t.ach[s]*lm; }
  }
  return Array.from(m.values()).filter(e=>sum(e.units)>0);
}
function laborByWeekday(ps){
  // minutes per weekday per site, from the daily harvest cells
  const day = DAYS.map(()=>[0,0,0]);
  for (const w of weeksOf(ps)) for (const t of w.rows){
    const lm = laborMin(t.pn);
    for (let k=0;k<15;k++) day[Math.floor(k/3)][k%3] += (t.daily[k]||0)*lm;
  }
  return day;
}
function stdTxt(pn){
  const l = S.labor[pn];
  if (!l || !l.labor) return '—';
  return l.labor + (S.unit==='min' ? ' min/u' : ' h/u');
}
/* ---------- tooltip ---------- */
const tip = $('#tip');
function showTip(ev, title, rows){
  tip.textContent = '';
  const t = document.createElement('div'); t.className='t'; t.textContent = title; tip.appendChild(t);
  for (const r of rows){
    const d = document.createElement('div'); d.className='r';
    if (r.color){ const k=document.createElement('span'); k.className='key'; k.style.borderTopColor=r.color; d.appendChild(k); }
    const v = document.createElement('span'); v.className='v'; v.textContent = r.value; d.appendChild(v);
    const n = document.createElement('span'); n.className='n'; n.textContent = r.name; d.appendChild(n);
    tip.appendChild(d);
  }
  tip.hidden = false; moveTip(ev);
}
function moveTip(ev){
  const pad=14, r=tip.getBoundingClientRect();
  let x=ev.clientX+pad, y=ev.clientY+pad;
  if (x+r.width > innerWidth-8) x = ev.clientX - r.width - pad;
  if (y+r.height > innerHeight-8) y = ev.clientY - r.height - pad;
  tip.style.left=x+'px'; tip.style.top=y+'px';
}
function hideTip(){ tip.hidden = true }

/* ---------- chart builders ---------- */
function legendHtml(items, kind){
  return '<div class="legend">' + items.map(i =>
    '<span class="k"><span class="'+(kind==='box'?'box':'line')+'" style="'+(kind==='box'?'background:':'border-top-color:')+i.color+'"></span>'+esc(i.name)+'</span>'
  ).join('') + '</div>';
}

function lineChart(el, {series, labels, yMax, target, yPct}){
  const W = Math.max(300, el.clientWidth || 640), H = 250;
  const L=42, R=16, T=12, B=26, n = labels.length;
  const ymax = yMax || niceMax(Math.max(1e-9, ...series.flatMap(s=>s.values.filter(v=>v!=null))));
  const x = i => n>1 ? L + i*(W-L-R)/(n-1) : (L+W-R)/2;
  const y = v => T + (1 - v/ymax)*(H-T-B);
  let g = '';
  const ticks = 4;
  for (let i=0;i<=ticks;i++){
    const v = ymax*i/ticks, yy = y(v);
    g += '<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="var(--grid)" stroke-width="1"/>';
    g += '<text class="axistext" x="'+(L-6)+'" y="'+(yy+3.5)+'" text-anchor="end">'+(yPct? Math.round(v*100)+'%' : fmtN(v))+'</text>';
  }
  if (target!=null && target<=ymax){
    g += '<line x1="'+L+'" y1="'+y(target)+'" x2="'+(W-R)+'" y2="'+y(target)+'" stroke="var(--axis)" stroke-width="1"/>';
    g += '<text x="'+(W-R)+'" y="'+(y(target)-4)+'" text-anchor="end">goal '+(yPct?Math.round(target*100)+'%':fmtN(target))+'</text>';
  }
  const step = Math.max(1, Math.ceil(n/9));
  for (let i=0;i<n;i+=step) g += '<text class="axistext" x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle">'+esc(labels[i])+'</text>';
  for (const s of series){
    let d='', started=false;
    s.values.forEach((v,i)=>{ if(v==null){started=false;return} d += (started?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; started=true; });
    g += '<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
    for (let i=s.values.length-1;i>=0;i--) if (s.values[i]!=null){
      g += '<circle cx="'+x(i)+'" cy="'+y(s.values[i])+'" r="4.5" fill="'+s.color+'" stroke="var(--surface)" stroke-width="2"/>';
      break;
    }
  }
  const ch = '<line class="xh" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" stroke="var(--axis)" stroke-width="1" visibility="hidden"/>';
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+ch+'<rect x="'+L+'" y="'+T+'" width="'+(W-L-R)+'" height="'+(H-T-B)+'" fill="transparent" class="ov"/></svg>';
  const svg = el.firstChild, ov = $('.ov', svg), xh = $('.xh', svg);
  ov.addEventListener('pointermove', ev=>{
    const r = svg.getBoundingClientRect(), sx = W/r.width;
    const px = (ev.clientX - r.left)*sx;
    let i = n>1 ? Math.round((px-L)/((W-L-R)/(n-1))) : 0;
    i = Math.max(0, Math.min(n-1, i));
    xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility','visible');
    showTip(ev, 'Cycle of '+labels[i], series.map(s=>({color:s.color, name:s.name,
      value: s.values[i]==null ? '—' : (yPct? pct1(s.values[i]) : fmtN(s.values[i]))})));
  });
  ov.addEventListener('pointerleave', ()=>{ xh.setAttribute('visibility','hidden'); hideTip(); });
}

function stackedCols(el, {groups, series, yFmt}){
  const W = Math.max(300, el.clientWidth || 640), H = 240;
  const L=46, R=10, T=12, B=26, n=groups.length, GAP=2;
  const ymax = niceMax(Math.max(1e-9, ...groups.map(gr=>sum(gr.values))));
  const y = v => T + (1 - v/ymax)*(H-T-B);
  const band = (W-L-R)/n, bw = Math.min(24, band*0.55);
  let g='';
  for (let i=0;i<=4;i++){
    const v=ymax*i/4, yy=y(v);
    g += '<line x1="'+L+'" y1="'+yy+'" x2="'+(W-R)+'" y2="'+yy+'" stroke="var(--grid)"/>';
    g += '<text class="axistext" x="'+(L-6)+'" y="'+(yy+3.5)+'" text-anchor="end">'+yFmt(v)+'</text>';
  }
  const hot=[];
  groups.forEach((gr,gi)=>{
    const cx = L + band*gi + band/2, x0 = cx-bw/2;
    let acc=0; const tot=sum(gr.values);
    gr.values.forEach((v,si)=>{
      if (v<=0){return}
      const y1=y(acc), y2=y(acc+v); acc+=v;
      const top = (acc===tot);
      if (top){
        const rr = Math.min(4, Math.max(0,(y1-y2))/2);
        g += '<path data-h="'+hot.length+'" d="M'+x0+' '+y1+' L'+x0+' '+(y2+rr)+' Q'+x0+' '+y2+' '+(x0+rr)+' '+y2+' L'+(x0+bw-rr)+' '+y2+' Q'+(x0+bw)+' '+y2+' '+(x0+bw)+' '+(y2+rr)+' L'+(x0+bw)+' '+y1+' Z" fill="'+series[si].color+'"/>';
      } else {
        g += '<rect data-h="'+hot.length+'" x="'+x0+'" y="'+(y2+GAP)+'" width="'+bw+'" height="'+Math.max(0,y1-y2-GAP)+'" fill="'+series[si].color+'"/>';
      }
      hot.push({title: gr.label, rows: gr.values.map((vv,k)=>({color:series[k].color, name:series[k].name, value:yFmt(vv)}))});
    });
    if (tot>0) g += '<text class="dlab" x="'+cx+'" y="'+(y(tot)-6)+'" text-anchor="middle">'+yFmt(tot)+'</text>';
    g += '<text class="axistext" x="'+cx+'" y="'+(H-8)+'" text-anchor="middle">'+esc(gr.label)+'</text>';
  });
  el.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
  $$('[data-h]', el).forEach(m=>{
    const h = hot[+m.dataset.h];
    m.addEventListener('pointermove', ev=>showTip(ev, h.title, h.rows));
    m.addEventListener('pointerleave', hideTip);
  });
}

function hbars(el, rows, {scaleMax, targetAt}){
  const mx = scaleMax;
  el.innerHTML = '<div class="hbars">' + rows.map((r,i)=>{
    const wpct = Math.max(0.5, Math.min(100, (r.frac/mx)*100));
    const inside = wpct > 55;
    return '<div class="blb" title="'+esc(r.label)+'">'+esc(r.label)+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div>'+
      '<div class="htrack" data-b="'+i+'">'+
        (targetAt!=null ? '<span class="htarget" style="left:'+(targetAt/mx*100)+'%"></span>' : '')+
        '<span class="hfill" style="width:'+wpct+'%"></span>'+
        '<span class="hval'+(inside?' in':'')+'" style="left:'+wpct+'%">'+esc(r.text)+'</span>'+
      '</div>';
  }).join('') + '</div>';
  $$('[data-b]', el).forEach(t=>{
    const r = rows[+t.dataset.b];
    t.addEventListener('pointermove', ev=>showTip(ev, r.tipTitle, r.tipRows));
    t.addEventListener('pointerleave', hideTip);
  });
}

function hbarsStacked(el, rows, {scaleMax, series}){
  el.innerHTML = '<div class="hbars">' + rows.map((r,i)=>{
    const total = sum(r.parts);
    const wpct = Math.min(100, (total/scaleMax)*100);
    let cum=0, segs='';
    r.parts.forEach((v,si)=>{
      if (v<=0) return;
      const left = (cum/scaleMax)*100, w = (v/scaleMax)*100; cum += v;
      const last = (cum===total);
      segs += '<span class="hseg'+(last?' last':'')+'" style="left:'+left+'%;width:max(2px, calc('+w+'% - 2px));background:'+series[si].color+'"></span>';
    });
    return '<div class="blb" title="'+esc(r.label)+'">'+esc(r.label)+(r.sub?'<small>'+esc(r.sub)+'</small>':'')+'</div>'+
      '<div class="htrack" data-b="'+i+'">'+segs+'<span class="hval" style="left:'+wpct+'%">'+esc(r.text)+'</span></div>';
  }).join('') + '</div>';
  $$('[data-b]', el).forEach(t=>{
    const r = rows[+t.dataset.b];
    t.addEventListener('pointermove', ev=>showTip(ev, r.tipTitle, r.tipRows));
    t.addEventListener('pointerleave', hideTip);
  });
}

function sparkline(values, w, h, accent){
  if (!values.length) return '';
  w=w||120; h=h||30;
  const mx = Math.max(1e-9, ...values), mn = Math.min(0, ...values);
  const x=i=>values.length>1 ? i*(w-8)/(values.length-1)+4 : w/2;
  const y=v=>2+(1-(v-mn)/(mx-mn||1))*(h-8);
  let d='';
  values.forEach((v,i)=>{ d += (i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)+' '; });
  const li = values.length-1;
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true">'+
    '<path d="'+d+'" fill="none" stroke="var(--axis)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'+
    '<circle cx="'+x(li)+'" cy="'+y(values[li])+'" r="3.5" fill="'+(accent||'var(--accent)')+'" stroke="var(--surface)" stroke-width="1.5"/></svg>';
}

function heatTable(el, {cols, rows, legend}){
  const grid = '<div class="heat" style="grid-template-columns:minmax(132px,210px) repeat('+cols.length+',minmax(64px,1fr))">'+
    '<span></span>' + cols.map(c=>'<span class="hd" style="text-align:center">'+esc(c)+'</span>').join('')+
    rows.map((r,ri)=> '<span class="rowlb">'+esc(r.label)+'</span>' + r.cells.map((c,ci)=>{
      if (!c) return '<span class="cell none">—</span>';
      const bg = rampColor(c.ramp, c.t);
      return '<span class="cell" data-hc="'+ri+'_'+ci+'" style="background:'+bg+';color:'+inkFor(bg)+'">'+esc(c.text)+'</span>';
    }).join('')).join('')+'</div>';
  el.innerHTML = '<div class="heatwrap">'+grid+'</div>' + (legend||'');
  $$('[data-hc]', el).forEach(cell=>{
    const [ri,ci] = cell.dataset.hc.split('_').map(Number);
    const c = rows[ri].cells[ci];
    cell.addEventListener('pointermove', ev=>showTip(ev, c.tip.title, c.tip.rows));
    cell.addEventListener('pointerleave', hideTip);
  });
}

function rampLegendHtml(ramp, lo, hi){
  const stops = ramp.map((c,i)=>c+' '+(i/(ramp.length-1)*100)+'%').join(',');
  return '<div class="ramplegend"><span>'+esc(lo)+'</span><span class="bar" style="background:linear-gradient(90deg,'+stops+')"></span><span>'+esc(hi)+'</span></div>';
}

function twinTable(headers, rows, totals){

    headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+

}

function cycleNote(){
  const multi = S.periods.filter(p=>p.span>1).length;
  return multi ? multi+' two-week goal cycles detected (week-2 tabs carry remaining asks; goals counted once per cycle).' : '';
}

function vOverview(m){
  const rep = reported(), pk = periodSH(rep), sh = aggSH(rep);
  const totGoal = sum(sh.map(s=>s.goal)), totAch = sum(sh.map(s=>s.ach));
  const att = totGoal>0 ? totAch/totGoal : null;
  const pigs = sum(sh.map(s=>s.pigs));
  const hrs = sum(laborBySH(rep));
  const attSeries = pk.map(x=>x.totAtt).filter(v=>v!=null);
  const shAtt = sh.map((s,i)=>({name:SHS[i], att: s.goal>0?s.ach/s.goal:null}));
  const best = shAtt.filter(s=>s.att!=null).sort((a,b)=>b.att-a.att);
  const tis = aggTissue(rep).filter(t=>t.goal>0).sort((a,b)=>a.ach/a.goal-b.ach/b.goal);
  const worst = tis[0];
  m.innerHTML =
    '<div class="cards tiles">'+
      '<div class="card tile hero"><div class="lb">Overall attainment · '+rep.length+' cycles</div>'+

      '<div class="meterrow"><span class="big">'+pct(att)+'</span>'+pillHtml(att)+'</div>'+
      '<div class="meter" style="background:color-mix(in srgb, '+fillVar+' 16%, var(--surface))">'+
        '<span class="fill" style="width:'+Math.min(100,(att||0)*100)+'%;background:'+fillVar+'"></span></div>'+
      '<div class="note" style="margin-top:8px">'+fmtN(s.ach)+' harvested of '+fmtN(s.goal)+' asked · '+fmtN(s.pigs)+' pigs</div>'+
      sparkline(series.slice(-12),150,30,SHCOL[i])+'</div>';

      card('Attainment by slaughterhouse, per goal cycle','Cycles where a site had no ask are gaps in its line.','sh_line',

          pk.map(x=>[x.p.name, ...x.goal.map(fmtN), ...x.ach.map(fmtN), ...x.att.map(pct1)]))})+

  const mx = niceMax(Math.max(...sh.map(s=>s.goal)));
  hbars($('#sh_vol'), sh.flatMap((s,i)=>[

  ]), {scaleMax:mx});

function vMatrix(m){

    card('Attainment by slaughterhouse and tissue','Cell = harvested ÷ cycle goals across the selected cycles. Darker blue is closer to goal; — means no ask.','mx_heat',{span:true})+

        const n = (pMap.get(t.pn)||[[],[],[]])[i].length;
        return {ramp:BLUE_RAMP, t:a, text:pct(a), tip:{title:tissueLabel(t.pn)+' — '+s,
          rows:[{name:'attainment', value:pct1(a)},{name:'harvested / goal', value:fmtN(t.achSH[i])+' / '+fmtN(t.goalSH[i])},{name:'cycles with ask', value:String(n)}]}};
      });
      const a = t.ach/t.goal;
      cells.push({ramp:BLUE_RAMP, t:a, text:pct(a), tip:{title:tissueLabel(t.pn)+' — all sites',
        rows:[{name:'attainment', value:pct1(a)},{name:'harvested / goal', value:fmtN(t.ach)+' / '+fmtN(t.goal)}]}});
      return {label:tissueLabel(t.pn), cells};
    }),
    legend: rampLegendHtml(BLUE_RAMP,'0%','100%+')
  });
}

function vVariability(m){
  const rep = reported(), pk = periodSH(rep);
  const tiles = SHS.map((name,i)=>{
    const vals = pk.map(x=>x.att[i]).filter(v=>v!=null);
    const mn = mean(vals), s = sd(vals);
    const goals = pk.map(x=>x.goal[i]).filter(v=>v>0);
    const goalCv = goals.length>2 && mean(goals)>0 ? sd(goals)/mean(goals) : null;
    const hit = vals.length ? vals.filter(v=>v>=0.9).length/vals.length : null;
    return '<div class="card tile"><div class="lb" style="display:flex;gap:6px;align-items:center"><span class="box" style="width:11px;height:11px;border-radius:3px;background:'+SHCOL[i]+'"></span>'+esc(name)+'</div>'+
      '<div class="val" style="font-size:23px">'+(s!=null? '±'+Math.round(s*100)+' pp':'—')+'</div>'+
      '<div class="delta">cycle-to-cycle swing (SD) · CV '+(s!=null&&mn?Math.round(s/mn*100)+'%':'—')+'</div>'+
      '<div class="delta">range '+(vals.length? pct(Math.min(...vals))+' – '+pct(Math.max(...vals)):'—')+
      ' · hits goal (≥90%) '+pct(hit)+' of cycles</div>'+
      '<div class="delta">ask volatility (CV of cycle goal) '+(goalCv!=null?Math.round(goalCv*100)+'%':'—')+'</div></div>';
  }).join('');
  m.innerHTML =
    '<div class="sectionhead"><h2>How steady is each site?</h2><p>Spread of per-cycle attainment. A site can average well and still be unreliable — the swing (standard deviation), the range, and how often it actually hits goal tell that story. Ask volatility shows how much the demand placed on the site moves, a frequent driver of misses.</p></div>'+
    '<div class="cards tiles" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))">'+tiles+'</div>'+
    '<div class="cards"><div class="card span"><h3>Attainment per cycle, site by site</h3><div class="note">Same 0–120% scale on each panel — flatter is steadier.</div><div class="smallmults" id="vr_sm"></div></div>'+
    card('Consistency by tissue (CV of per-cycle attainment)','Coefficient of variation across cycles with an ask — darker orange is less predictable. Needs ≥3 asked cycles.','vr_heat',{span:true})+
    card('Harvest by weekday','Total units harvested per weekday, stacked by site. A fade into Thu–Fri is a common source of misses.','vr_days',
      {span:true, pre: legendHtml(SHS.map((n,i)=>({name:n,color:SHCOL[i]})),'box')})+
    '</div>';
  const sm = $('#vr_sm');
  sm.innerHTML = SHS.map((n,i)=>'<div><div class="legend" style="margin-bottom:2px"><span class="k"><span class="line" style="border-top-color:'+SHCOL[i]+'"></span>'+esc(n)+'</span></div><div class="chart" id="vr_sm_'+i+'"></div></div>').join('');
  SHS.forEach((n,i)=>{
    lineChart($('#vr_sm_'+i), {series:[{name:n, color:SHCOL[i], values: pk.map(x=>x.att[i])}],
      labels: pk.map(x=>x.p.label), yMax:1.2, target:1, yPct:true});
  });
  const pMap = shTissuePeriod(rep);
  const tis = aggTissue(rep).filter(t=>t.goal>0).sort((a,b)=>b.goal-a.goal);
  const cvMax = 1.0;
  heatTable($('#vr_heat'), {
    cols:[...SHS],
    rows: tis.map(t=>{
      const cells = SHS.map((s,i)=>{
        const vals = (pMap.get(t.pn)||[[],[],[]])[i];
        if (vals.length<3) return null;
        const mn = mean(vals), sdd = sd(vals);
        if (!mn || sdd==null) return null;
        const cv = sdd/mn;
        return {ramp:ORANGE_RAMP, t:Math.min(1,cv/cvMax), text:Math.round(cv*100)+'%',
          tip:{title:tissueLabel(t.pn)+' — '+s, rows:[
            {name:'CV of per-cycle attainment', value:Math.round(cv*100)+'%'},
            {name:'mean attainment', value:pct1(mn)},
            {name:'cycles with ask', value:String(vals.length)}]}};
      });
      return {label:tissueLabel(t.pn), cells};
    }),
    legend: rampLegendHtml(ORANGE_RAMP,'steady (0%)','volatile (100%+)')
  });
  const wks = weeksOf(rep);
  const dayTotals = DAYS.map((d,di)=>({label:d, values: SHS.map((s,si)=>{
    let v=0; for (const w of wks) for (const t of w.rows) v += t.daily[di*3+si]||0; return v;
  })}));
  stackedCols($('#vr_days'), {groups:dayTotals, series:SHS.map((n,i)=>({name:n,color:SHCOL[i]})), yFmt:fmtN});
}

function vLabor(m){
  const rep = reported();
  const shHrs = laborBySH(rep);
  const T = techStats(rep);
  const techs = Array.from(T.entries()).filter(([n])=>n!=='Unassigned').sort((a,b)=>b[1].min-a[1].min);
  const unass = T.get('Unassigned');
  const totalHrs = sum(Array.from(T.values()).map(e=>e.min))/60;
  const techCols = ['var(--s1)','var(--s2)','var(--s3)'];
  const repWeeks = weeksOf(rep);
  const perWeekTech = repWeeks.filter(w=>w.rows.some(t=>sum(t.ach)>0)).map(w=>{
    const byTech = {};
    for (let k=0;k<15;k++){
      const tech=w.techs[k]; if(!tech) continue;
      let mn=0; for (const t of w.rows) mn += (t.daily[k]||0)*laborMin(t.pn);
      byTech[tech]=(byTech[tech]||0)+mn;
    }
    return {w, byTech};
  });
  const techNames = techs.map(([n])=>n).slice(0,3);
  const tisLab = laborByTissue(rep).sort((a,b)=>sum(b.min)-sum(a.min));
  const totMin = sum(tisLab.map(e=>sum(e.min)));
  let cumMin = 0;
  const ledgerRows = tisLab.map(e=>{
    cumMin += sum(e.min);
    return [tissueName(e.pn), e.pn, stdTxt(e.pn), fmtN(sum(e.units)),
      fmt1(e.min[0]/60), fmt1(e.min[1]/60), fmt1(e.min[2]/60), fmt1(sum(e.min)/60),
      totMin?Math.round(sum(e.min)/totMin*100)+'%':'—', totMin?Math.round(cumMin/totMin*100)+'%':'—'];
  });
  const stdRows = Object.keys(S.names).filter(pn=>S.labor[pn] && S.labor[pn].labor)
    .sort((a,b)=>(S.labor[b].labor||0)-(S.labor[a].labor||0));
  const top3Share = totMin ? Math.round(tisLab.slice(0,3).reduce((a,e)=>a+sum(e.min),0)/totMin*100) : 0;
  const stdDetails = '<details class="twin"><summary>Labor standards in use ('+stdRows.length+' part numbers)</summary>'+
    '<div class="tblwrap"><table><thead><tr><th>Tissue</th><th>PN</th><th>Standard</th></tr></thead><tbody>'+
    stdRows.map(pn=>'<tr><td>'+esc(tissueName(pn))+'</td><td class="dim">'+esc(pn)+'</td><td>'+esc(stdTxt(pn))+'</td></tr>').join('')+
    '</tbody></table></div></details>';
  m.innerHTML =
    '<div class="banner"><strong>How labor is estimated.</strong> Units harvested × per-tissue labor standard from the capacity tool’s Yields-Labor-Cube sheet, read as <strong>'+(S.unit==='min'?'minutes':'hours')+' per unit</strong> (switch in the filter bar). Tech attribution uses the “Tech Harvesting” row of each weekly tab: a tech accrues the tissue harvested on the site-days they were assigned, and a share of each site’s cycle goal proportional to their assigned days there.</div>'+
    '<div class="cards tiles">'+
      '<div class="card tile"><div class="lb">Est. harvest labor</div><div class="val">'+fmtN(totalHrs)+'<small> h</small></div><div class="delta">'+(rep.length?fmtN(totalHrs/rep.length)+' h / cycle':'')+'</div></div>'+
      techs.slice(0,3).map(([n,e],i)=>{
        const att = e.goal>0 ? e.units/e.goal : null;
        return '<div class="card tile"><div class="lb" style="display:flex;gap:6px;align-items:center"><span style="width:11px;height:11px;border-radius:3px;background:'+techCols[i]+'"></span>'+esc(n)+'</div>'+
        '<div class="val">'+fmtN(e.min/60)+'<small> h</small></div>'+
        '<div class="delta">'+fmtN(e.units)+' units · '+e.days+' site-days · util. '+pct(e.days? (e.min/60)/(e.days*8):null)+' of 8h days</div>'+
        '<div class="delta">attainment '+pct(att)+' '+pillHtml(att)+'</div></div>';}).join('')+
    '</div>'+
    '<div class="cards">'+
      card('Where the labor goes — tissue × site','Hours = units harvested × the standard printed on each bar ÷ 60. The top 3 tissues carry '+top3Share+'% of all harvest labor.','lb_tis',
        {span:true, pre: legendHtml(SHS.map((n,i)=>({name:n,color:SHCOL[i]})),'box'),
         post: twinTable(['Tissue','PN','Std','Units','Nahunta h','Martin h','Custom h','Total h','% of labor','Cum. %'], ledgerRows) + stdDetails})+
      card('Labor by weekday','Estimated hours per weekday, stacked by site — computed from the daily harvest cells.','lb_days',
        {span:true, pre: legendHtml(SHS.map((n,i)=>({name:n,color:SHCOL[i]})),'box')})+
    '</div>'+
    '<div class="cards">'+
      card('Labor by slaughterhouse','Estimated hours to harvest what was achieved at each site.','lb_sh')+
      card('Attainment by tech','Harvested units vs the goal share attributed from assigned site-days.','lb_att')+
      card('Weekly labor by tech','Estimated hours accrued per tech per reported week.','lb_wk',
        {span:true, pre: legendHtml(techNames.map((n,i)=>({name:n,color:techCols[i]})),'line'),
         post: twinTable(['Week', ...techNames.map(n=>n+' (h)')],
           perWeekTech.map(x=>[x.w.name, ...techNames.map(n=>fmt1((x.byTech[n]||0)/60))]))})+
    '</div>'+
    '<div class="cards"><div class="card span"><h3>Tech ledger</h3><div class="note">Everything attributed from daily cells and assignments in the selected cycles.'+(unass&&unass.units>0?' “Unassigned” collects harvest on site-days with no tech listed.':'')+'</div>'+
      '<div class="tblwrap"><table><thead><tr><th>Tech</th><th>Site-days</th><th>Units harvested</th><th>Goal share</th><th>Attainment</th><th>Est. hours</th><th>h / site-day</th></tr></thead><tbody>'+
      Array.from(T.entries()).sort((a,b)=>b[1].units-a[1].units).map(([n,e])=>{
        const att = e.goal>0? e.units/e.goal : null;
        return '<tr><td>'+esc(n)+'</td><td>'+(e.days||0)+'</td><td>'+fmtN(e.units)+'</td><td>'+fmtN(e.goal)+'</td><td>'+pct1(att)+'</td><td>'+fmtN(e.min/60)+'</td><td>'+(e.days?fmt1(e.min/60/e.days):'—')+'</td></tr>';
      }).join('')+'</tbody></table></div></div></div>';
  hbarsStacked($('#lb_tis'), tisLab.map(e=>({
    label: tissueLabel(e.pn),
    sub: fmtN(sum(e.units))+' u · '+stdTxt(e.pn),
    parts: e.min.map(x=>x/60),
    text: fmt1(sum(e.min)/60)+' h',
    tipTitle: tissueLabel(e.pn)+' — '+fmt1(sum(e.min)/60)+' h',
    tipRows: SHS.map((s,i)=>({color:SHCOL[i], name:s+' — '+fmtN(e.units[i])+' u', value:fmt1(e.min[i]/60)+' h'}))
      .concat([{name:'standard', value:stdTxt(e.pn)}])
  })), {scaleMax: niceMax(Math.max(1e-9,...tisLab.map(e=>sum(e.min)/60))), series: SHS.map((n,i)=>({name:n,color:SHCOL[i]}))});
  const dl = laborByWeekday(rep);
  stackedCols($('#lb_days'), {groups: DAYS.map((d,di)=>({label:d, values: dl[di].map(x=>x/60)})),
    series: SHS.map((n,i)=>({name:n,color:SHCOL[i]})), yFmt: v=>fmt1(v)+' h'});
  const mxh = niceMax(Math.max(1,...shHrs));
  hbars($('#lb_sh'), shHrs.map((h,i)=>({label:SHS[i], frac:h, text:fmtN(h)+' h',
    tipTitle:SHS[i], tipRows:[{color:SHCOL[i], name:'est. hours', value:fmtN(h)+' h'}]})), {scaleMax:mxh});
  const attRows = techs.slice(0,4).map(([n,e])=>{
    const a = e.goal>0? e.units/e.goal : 0;
    return {label:n, sub:fmtN(e.units)+' / '+fmtN(e.goal), frac:a, text:pct(a),
      tipTitle:n, tipRows:[{name:'harvested', value:fmtN(e.units)},{name:'goal share', value:fmtN(e.goal)},{name:'attainment', value:pct1(a)}]};
  });
  hbars($('#lb_att'), attRows, {scaleMax:Math.max(1.2,...attRows.map(r=>r.frac)), targetAt:1});
  lineChart($('#lb_wk'), {series: techNames.map((n,i)=>({name:n, color:techCols[i],
      values: perWeekTech.map(x=> x.byTech[n]!=null ? x.byTech[n]/60 : null)})),
    labels: perWeekTech.map(x=>weekLabel(x.w)), yPct:false});
}

function vData(m){
  const ps = slice();
  const pk = periodSH(ps);
  const wks = weeksOf(ps);
  if (S.drillWeek==null || !wks.some(w=>w.name===S.drillWeek)){
    const lastRep = [...wks].reverse().find(w=>w.rows.some(t=>sum(t.ach)>0));
    S.drillWeek = lastRep ? lastRep.name : (wks[wks.length-1]&&wks[wks.length-1].name);
  }
  const posOf = w => {
    const p = ps.find(p=>p.weeks.includes(w));
    return p && p.span>1 ? ' — wk '+(p.weeks.indexOf(w)+1)+' of '+p.span+' (cycle '+p.name+')' : '';
  };
  m.innerHTML =
    '<div class="cards"><div class="card span"><h3>Week drilldown</h3>'+
    '<div class="note" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">Pick a weekly tab to see it tissue by tissue. Week-2 tabs show remaining asks.'+
    '<select id="drillsel" aria-label="Drilldown week">'+wks.map(x=>'<option value="'+esc(x.name)+'"'+(x.name===S.drillWeek?' selected':'')+'>'+esc(x.name+posOf(x))+(x.rows.some(t=>sum(t.ach)>0)?'':' (no data)')+'</option>').join('')+'</select></div>'+
    '<div id="drilltbl"></div></div>'+
    '<div class="card span"><h3>Cycle totals in range</h3><div class="note">'+esc(cycleNote())+'</div><div class="tblwrap"><table><thead><tr><th>Cycle</th><th>Weeks</th><th>Goal</th><th>Harvested</th><th>Attainment</th>'+SHS.map(s=>'<th>'+esc(s)+'</th>').join('')+'<th>Pigs</th></tr></thead><tbody>'+
      pk.map(x=>'<tr><td>'+esc(x.p.name)+'</td><td class="dim">'+x.p.weeks.map(weekLabel).join(', ')+'</td><td>'+fmtN(sum(x.goal))+'</td><td>'+fmtN(sum(x.ach))+'</td><td>'+pct1(x.totAtt)+'</td>'+
        x.att.map(a=>'<td>'+pct1(a)+'</td>').join('')+'<td class="dim">'+fmtN(sum(x.p.pigs))+'</td></tr>').join('')+
      '</tbody></table></div></div></div>';
  function renderDrill(){
    const w = wks.find(x=>x.name===S.drillWeek);
    const el = $('#drilltbl');
    if (!w){ el.innerHTML=''; return; }
    const dayLab = DAYS.map((d,di)=>SHS.map((s,si)=>{
      let mn=0; for (const t of w.rows) mn += (t.daily[di*3+si]||0)*laborMin(t.pn); return mn;
    }));
    el.innerHTML = '<div class="tblwrap"><table><thead><tr><th>Tissue</th>'+
      SHS.map(s=>'<th>'+esc(s)+' ask</th><th>'+esc(s)+' ach</th>').join('')+
      '<th>Total ask</th><th>Total ach</th><th>Att.</th><th>Std</th><th>Est. h</th></tr></thead><tbody>'+
      w.rows.map(t=>{
        const ta = sum(t.ask), th = sum(t.ach);
        return '<tr><td>'+esc(tissueLabel(t.pn))+'</td>'+
          SHS.map((s,i)=>'<td class="dim">'+(t.ask[i]?fmtN(t.ask[i]):'—')+'</td><td>'+(t.ach[i]?fmtN(t.ach[i]):'—')+'</td>').join('')+
          '<td>'+fmtN(ta)+'</td><td>'+fmtN(th)+'</td><td>'+pct1(ta>0?th/ta:null)+'</td>'+
          '<td class="dim">'+esc(stdTxt(t.pn))+'</td><td>'+(th?fmt1(th*laborMin(t.pn)/60):'—')+'</td></tr>';
      }).join('')+'</tbody></table></div>'+
      '<h3 style="margin-top:16px;font-size:13.5px">Estimated labor this week, by day and site (h)</h3>'+
      '<div class="tblwrap"><table><thead><tr><th>Site</th>'+DAYS.map(d=>'<th>'+esc(d)+'</th>').join('')+'<th>Total</th></tr></thead><tbody>'+
      SHS.map((s,si)=>'<tr><td>'+esc(s)+'</td>'+
        DAYS.map((d,di)=>'<td>'+(dayLab[di][si]?fmt1(dayLab[di][si]/60):'—')+'</td>').join('')+
        '<td>'+fmt1(sum(dayLab.map(dv=>dv[si]))/60)+'</td></tr>').join('')+
      '<tr class="total"><td>All sites</td>'+DAYS.map((d,di)=>'<td>'+fmt1(sum(dayLab[di])/60)+'</td>').join('')+
      '<td>'+fmt1(sum(dayLab.flat())/60)+'</td></tr>'+
      '</tbody></table></div>'+
      '<div class="note" style="margin-top:10px">Tech schedule this week: '+
      SHS.map((s,i)=>{
        const days = DAYS.map((d,di)=>w.techs[di*3+i]).filter(Boolean);
        const uniq = [...new Set(days)];
        return esc(s)+' → '+(uniq.length?esc(uniq.join(', '))+' ('+days.length+'d)':'—');
      }).join(' · ')+
      (w.pigs? ' · Pigs received: '+SHS.map((s,i)=>esc(s)+' '+fmtN(w.pigs.sh[i])).join(', ') : '')+'</div>';
  }
  renderDrill();
  $('#drillsel').addEventListener('change', e=>{ S.drillWeek = e.target.value; renderDrill(); });
}

/* ---------- render ---------- */
const VIEWS = {overview:vOverview, sh:vSH, tissue:vTissue, matrix:vMatrix, variability:vVariability, labor:vLabor, data:vData};
function render(){
  $$('.tab').forEach(t=>t.setAttribute('aria-selected', String(t.dataset.view===S.view)));
  const n = slice().length, r = reported().length;
  $('#rangecount').textContent = r+' reported of '+n+' cycles in range';
  $('#fileinfo').innerHTML = '<strong>'+esc(S.source)+'</strong> · '+S.weeks.length+' tabs · '+S.periods.length+' cycles';
  const m = $('#main');
  hideTip();
  if (!S.weeks.length){
    m.innerHTML = '<div class="card"><h3>No data loaded</h3><div class="note">Drop your weekly-goals workbook anywhere on the page, or use “Load workbook…”.</div></div>';
    return;
  }
  if (!reported().length && S.view!=='data'){
    m.innerHTML = '<div class="card"><h3>No reported cycles in this range</h3><div class="note">The selected cycles have goals but no harvest recorded yet. Widen the range, or check the Data tab.</div></div>';
    return;
  }
  VIEWS[S.view](m);
}

/* ---------- filters & tabs ---------- */
function periodOption(p, i){
  return '<option value="'+i+'">'+esc(p.name + (p.span>1 ? ' ('+p.span+'wk)' : ''))+'</option>';
}
function buildWeekSelects(){
  const opts = S.periods.map(periodOption).join('');
  $('#wfrom').innerHTML = opts; $('#wto').innerHTML = opts;
  $('#wfrom').value = S.from; $('#wto').value = S.to;
}
function markPreset(p){ $$('.chip').forEach(c=>c.setAttribute('aria-pressed', String(c.dataset.preset===p))); }
function applyPreset(p){
  const n = S.periods.length; if (!n) return;
  const lastRepIdx = (()=>{ for(let i=n-1;i>=0;i--) if(isReported(S.periods[i])) return i; return n-1; })();
  const dayDiff = (a,b) => Math.round((new Date(a) - new Date(b)) / 86400000);
  const d0 = S.periods[0].date;
  const inQ = (i,q) => { const dd = dayDiff(S.periods[i].date, d0); return dd >= (q-1)*91 && dd < q*91; };
  const qRange = q => {
    let f=-1, t=-1;
    for (let i=0;i<n;i++) if (inQ(i,q)){ if(f<0) f=i; t=i; }
    return f<0 ? null : [f,t];
  };
  if (p==='all'){ S.from=0; S.to=n-1; }
  else if (p==='l3'){ S.to=lastRepIdx; S.from=Math.max(0,lastRepIdx-2); }
  else if (p==='l6'){ S.to=lastRepIdx; S.from=Math.max(0,lastRepIdx-5); }
  else if (p==='q1'||p==='q2'||p==='q3'){
    const r = qRange(+p[1]); if(!r) return;
    S.from=r[0]; S.to=r[1];
  }
  $('#wfrom').value=S.from; $('#wto').value=S.to;
  markPreset(p); render();
}
$('#filters').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if (c) applyPreset(c.dataset.preset);
});
$('#wfrom').addEventListener('change', e=>{ S.from=+e.target.value; if(S.from>S.to){S.to=S.from; $('#wto').value=S.to;} markPreset(''); render(); });
$('#wto').addEventListener('change', e=>{ S.to=+e.target.value; if(S.to<S.from){S.from=S.to; $('#wfrom').value=S.from;} markPreset(''); render(); });
$('#laborunit').addEventListener('change', e=>{ S.unit=e.target.value; render(); });
$('#tabs').addEventListener('click', e=>{
  const t = e.target.closest('.tab'); if(!t) return;
  S.view = t.dataset.view; render();
  try{ localStorage.setItem('tha_view', S.view); }catch(err){}
});

/* ---------- upload ---------- */
function toast(msg, isErr){
  const t = $('#toast'); t.textContent = msg; t.hidden=false;
  t.style.background = isErr ? 'var(--crit)' : 'var(--ink)';
  t.style.color = isErr ? '#fff' : 'var(--page)';
  clearTimeout(toast._h); toast._h = setTimeout(()=>{ t.hidden=true }, 4200);
}
const WEEK_RE = /^\d{1,2}_\d{1,2}_\d{2}$/;
const PN_RE = /^\d{6}(-\d+)?$/;
function cellN(v){ const x = typeof v==='number' ? v : parseFloat(v); return isFinite(x) ? Math.round(x*1000)/1000 : 0; }
function parseWeeklyWb(wb){
  const weeks=[], names={};
  for (const sn of wb.SheetNames){
    if (!WEEK_RE.test(sn.trim())) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
    if (rows.length < 4) continue;
    const r0 = rows[0]||[], techrow = rows[1]||[];
    const techs=[]; for (let k=12;k<27;k++) techs.push(techrow[k]?String(techrow[k]).trim():'');
    const [mm,dd,yy] = sn.trim().split('_').map(Number);
    const wk = {name:sn.trim(), date:'20'+String(yy).padStart(2,'0')+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0'),
                c1: r0[2]!=null ? String(r0[2]).trim() : '', techs, pigs:null, rows:[]};
    for (const r of rows.slice(3)){
      if (!r) continue;
      const c2 = r[2]!=null ? String(r[2]).trim() : '';
      const pn = r[0]!=null ? String(r[0]).trim() : '';
      const daily=[]; for (let k=12;k<27;k++) daily.push(cellN(r[k]));
      if (c2.startsWith('Total Pigs')){ wk.pigs={sh:[cellN(r[5]),cellN(r[7]),cellN(r[9])], daily}; continue; }
      if (!PN_RE.test(pn)) continue;
      if (c2) names[pn]=c2;
      wk.rows.push({pn, nm:c2, ask:[cellN(r[4]),cellN(r[6]),cellN(r[8])], ach:[cellN(r[5]),cellN(r[7]),cellN(r[9])], daily});
    }
    if (wk.rows.length) weeks.push(wk);
  }
  return {weeks, tissueNames:names};
}
function parseCapacityWb(wb){
  const sn = wb.SheetNames.find(n=>/yields.*labor/i.test(n));
  if (!sn) return null;
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], {header:1, raw:true, defval:null});
  const labor={};
  for (const r of rows){
    if (!r || r[0]==null) continue;
    const pn = String(r[0]).trim();
    if (PN_RE.test(pn)) labor[pn]={labor:cellN(r[2]), cube:cellN(r[3])};
  }
  return Object.keys(labor).length ? labor : null;
}
async function handleFile(file){
  try{
    const wb = XLSX.read(await file.arrayBuffer(), {type:'array'});
    const cap = parseCapacityWb(wb);
    const wkly = parseWeeklyWb(wb);
    if (wkly.weeks.length){
      loadData({weeks:wkly.weeks, tissueNames:wkly.tissueNames}, file.name);
      buildWeekSelects(); markPreset('all');
      if (cap) S.labor = Object.assign({}, S.labor, cap);
      toast('Loaded '+wkly.weeks.length+' weekly tabs ('+S.periods.length+' goal cycles) from '+file.name);
      render();
    } else if (cap){
      S.labor = Object.assign({}, S.labor, cap);
      toast('Labor standards updated from '+file.name+' ('+Object.keys(cap).length+' part numbers)');
      render();
    } else {
      toast('No weekly tabs (like 02_09_26) or Yields-Labor sheet found in '+file.name, true);
    }
  }catch(err){
    toast('Could not read '+file.name+': '+err.message, true);
  }
}
$('#uploadbtn').addEventListener('click', ()=>$('#fileinput').click());
$('#fileinput').addEventListener('change', e=>{ if(e.target.files[0]) handleFile(e.target.files[0]); e.target.value=''; });
let dragDepth=0;
addEventListener('dragenter', e=>{ e.preventDefault(); dragDepth++; $('#drop').hidden=false; });
addEventListener('dragover', e=>e.preventDefault());
addEventListener('dragleave', e=>{ if(--dragDepth<=0){ dragDepth=0; $('#drop').hidden=true; } });
addEventListener('drop', e=>{
  e.preventDefault(); dragDepth=0; $('#drop').hidden=true;
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

/* ---------- boot ---------- */
let rzT;
addEventListener('resize', ()=>{ clearTimeout(rzT); rzT=setTimeout(render, 160); });
if (EMBED) loadData(EMBED, EMBED.source + ' (embedded)');
try{ const v = localStorage.getItem('tha_view'); if (v && VIEWS[v]) S.view=v; }catch(err){}
buildWeekSelects(); markPreset('all');
render();
</script>
